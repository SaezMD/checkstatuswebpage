services:
  monitor-reservas:
    build: .
    container_name: monitor-reservas
    restart: unless-stopped
    # Opcional pero recomendado: puedes pasar los tokens como variables de entorno
    environment:
      - TELEGRAM_BOT_TOKEN: ${TELEGRAM_TOKEN:?Configura TELEGRAM_TOKEN en Portainer}
      - TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Configura TELEGRAM_CHAT_ID en Portainer}
